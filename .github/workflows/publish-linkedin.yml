name: Publicar artigo no LinkedIn

on:
  push:
    branches:
      - main
      - master
    paths:
      - "docs/articles/**"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check requests

      - name: Publicar artigo alterado
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PERSON_URN: ${{ secrets.PERSON_URN }}
          BLOG_BASE_URL: https://personal.caracore.com.br
          POSTS_DIRECTORY: docs/articles
          PUBLIC_ARTICLES_PATH: articles
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: python linkedin_rss_auto.py
