name: Publicar artigo no LinkedIn

on:
  push:
    branches:
      - main
      - master
    paths:
      - "docs/articles/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check requests

      - name: Atualizar feed.xml e sitemap.xml
        run: |
          python update_feed.py
          python update_sitemap.py

      - name: Validar XML gerado
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('docs/feed.xml')"
          python -c "import xml.etree.ElementTree as ET; ET.parse('docs/sitemap.xml')"

      - name: Publicar artigos alterados
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PERSON_URN: ${{ secrets.PERSON_URN }}
          BLOG_BASE_URL: https://personal.caracore.com.br
          POSTS_DIRECTORY: docs/articles
          PUBLIC_ARTICLES_PATH: articles
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: python linkedin_rss_auto.py

      - name: Commitar feed.xml, sitemap.xml e registro de publicacoes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/sitemap.xml linkedin_published.json
          git diff --cached --quiet || git commit -m "chore: atualiza feed.xml, sitemap.xml e registro de publicacoes [skip ci]"
          git push
